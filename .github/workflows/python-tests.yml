name: Python tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify reproducibility
        run: python scripts/verify_reproducibility.py --report-json results/reproducibility-${{ matrix.python-version }}.json

      - name: Upload reproducibility report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproducibility-report-py${{ matrix.python-version }}
          path: results/reproducibility-${{ matrix.python-version }}.json
          if-no-files-found: ignore
